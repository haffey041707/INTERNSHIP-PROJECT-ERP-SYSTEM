<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="refresh" content="0; url=https://edunexus-erp-tau.vercel.app/login">
    <title>EduNexus ERP</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(14, 165, 233, 0.18), transparent 32rem),
          radial-gradient(circle at 75% 80%, rgba(245, 158, 11, 0.14), transparent 28rem),
          #0f172a;
      }

      main {
        width: min(92vw, 30rem);
        padding: 2rem;
        border: 1px solid rgba(248, 250, 252, 0.16);
        border-radius: 1.25rem;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 8vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0 0 1.5rem;
        color: #cbd5e1;
      }

      a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 3rem;
        padding: 0 1.2rem;
        border-radius: 0.8rem;
        background: #38bdf8;
        color: #082f49;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
    <script>
      window.location.replace("https://edunexus-erp-tau.vercel.app/login");
    </script>
  </head>
  <body>
    <main>
      <h1>EduNexus ERP</h1>
      <p>Opening the live system now.</p>
      <a href="https://edunexus-erp-tau.vercel.app/login">Open ERP</a>
    </main>
  </body>
</html>
