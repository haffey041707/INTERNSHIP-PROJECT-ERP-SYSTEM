<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Community hub visual</title>
  <desc id="desc">A dark glass community workspace with member nodes, event pulse, polls, announcements, and moderation signals.</desc>
  <defs>
    <linearGradient id="communityBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21115C"/>
      <stop offset=".48" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="violetPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="tealBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="amberRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="760" height="520" rx="44" fill="url(#communityBg)"/>
  <circle cx="184" cy="130" r="126" fill="#7C3AED" opacity=".24" filter="url(#glow)"/>
  <circle cx="610" cy="378" r="154" fill="#06B6D4" opacity=".18" filter="url(#glow)"/>
  <path d="M88 395C188 308 265 330 356 242S545 124 676 182" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="7 13" opacity=".46"/>
  <path d="M126 174C245 250 320 230 430 300s172 60 238-2" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="8 12" opacity=".38"/>

  <g filter="url(#softShadow)">
    <circle cx="380" cy="255" r="92" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.20)" stroke-width="2"/>
    <circle cx="380" cy="255" r="58" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <circle cx="380" cy="255" r="26" fill="url(#violetPink)"/>
    <path d="M368 253c0-11 24-11 24 0v16h-24v-16z" fill="#FFFFFF" opacity=".88"/>
    <circle cx="380" cy="238" r="13" fill="#FFFFFF" opacity=".94"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="222" cy="170" r="42" fill="url(#tealBlue)"/>
    <circle cx="222" cy="156" r="13" fill="#FFFFFF" opacity=".88"/>
    <path d="M198 190c7-19 41-19 48 0" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".86"/>
    <rect x="158" y="228" width="134" height="48" rx="24" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)"/>
    <path d="M188 252h72" stroke="#C4B5FD" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="558" cy="168" r="42" fill="url(#violetPink)"/>
    <path d="M538 171l18-11v-15l38 18v28l-38-18v-15l-18 13z" fill="#FFFFFF" opacity=".9"/>
    <rect x="500" y="226" width="132" height="54" rx="22" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)"/>
    <path d="M528 248h76M528 264h42" stroke="#E9D5FF" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="210" cy="352" r="43" fill="url(#amberRose)"/>
    <rect x="192" y="332" width="36" height="40" rx="7" fill="#FFFFFF" opacity=".9"/>
    <path d="M200 346h20M200 359h14" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <rect x="134" y="407" width="164" height="48" rx="24" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)"/>
    <circle cx="170" cy="431" r="10" fill="#FBBF24"/>
    <circle cx="205" cy="431" r="10" fill="#34D399"/>
    <circle cx="240" cy="431" r="10" fill="#FB7185"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="560" cy="350" r="44" fill="url(#tealBlue)"/>
    <path d="M560 326l30 12v22c0 18-13 30-30 38-17-8-30-20-30-38v-22l30-12z" fill="#FFFFFF" opacity=".9"/>
    <path d="M545 360l10 10 22-28" fill="none" stroke="#0F766E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="492" y="406" width="144" height="50" rx="25" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)"/>
    <path d="M524 431h82" stroke="#99F6E4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g opacity=".88">
    <circle cx="306" cy="217" r="7" fill="#C4B5FD"/>
    <circle cx="450" cy="200" r="7" fill="#22D3EE"/>
    <circle cx="304" cy="326" r="7" fill="#FBBF24"/>
    <circle cx="454" cy="338" r="7" fill="#34D399"/>
    <path d="M306 217L380 255 450 200M380 255l-76 71M380 255l74 83" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="3"/>
  </g>
</svg>
