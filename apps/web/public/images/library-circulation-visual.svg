<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Library circulation visual</title>
  <desc id="desc">A professional library ERP visual with catalogue shelves, barcode scanning, issue cards, reservations, due date control, and reading analytics.</desc>
  <defs>
    <linearGradient id="libraryBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052E2B"/>
      <stop offset=".48" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="21" flood-color="#020617" flood-opacity=".36"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="760" height="520" rx="44" fill="url(#libraryBg)"/>
  <circle cx="150" cy="406" r="142" fill="#14B8A6" opacity=".18" filter="url(#glow)"/>
  <circle cx="606" cy="124" r="132" fill="#A78BFA" opacity=".20" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="106" width="270" height="318" rx="34" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <path d="M118 168h190M118 248h190M118 328h190" stroke="rgba(255,255,255,.20)" stroke-width="6" stroke-linecap="round"/>
    <rect x="122" y="132" width="28" height="68" rx="10" fill="url(#emerald)"/>
    <rect x="160" y="146" width="28" height="54" rx="10" fill="url(#violet)"/>
    <rect x="198" y="122" width="28" height="78" rx="10" fill="url(#gold)"/>
    <rect x="236" y="140" width="28" height="60" rx="10" fill="#38BDF8"/>
    <rect x="122" y="214" width="30" height="72" rx="10" fill="#A78BFA"/>
    <rect x="164" y="226" width="30" height="60" rx="10" fill="#34D399"/>
    <rect x="206" y="204" width="30" height="82" rx="10" fill="#F472B6"/>
    <rect x="248" y="234" width="30" height="52" rx="10" fill="#FBBF24"/>
    <rect x="122" y="296" width="28" height="82" rx="10" fill="#22D3EE"/>
    <rect x="160" y="318" width="28" height="60" rx="10" fill="#FB7185"/>
    <rect x="198" y="308" width="28" height="70" rx="10" fill="#818CF8"/>
    <rect x="236" y="286" width="28" height="92" rx="10" fill="#2DD4BF"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="408" y="92" width="228" height="146" rx="34" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <circle cx="462" cy="166" r="34" fill="url(#emerald)"/>
    <path d="M444 166h36M462 148v36" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M522 138h72M522 166h92M522 194h54" stroke="#CCFBF1" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <rect x="440" y="258" width="154" height="42" rx="21" fill="rgba(20,184,166,.18)" stroke="rgba(153,246,228,.30)"/>
    <path d="M462 279h96" stroke="#99F6E4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="404" y="326" width="112" height="112" rx="32" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <circle cx="460" cy="382" r="35" fill="url(#gold)"/>
    <path d="M460 358v25l17 10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M430 450h60" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="322" width="128" height="116" rx="34" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <path d="M580 396c16-44 34-68 58-76" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round"/>
    <path d="M580 396c24-22 44-24 76-8" fill="none" stroke="#A78BFA" stroke-width="9" stroke-linecap="round"/>
    <circle cx="638" cy="320" r="12" fill="#22D3EE"/>
    <circle cx="656" cy="388" r="12" fill="#A78BFA"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="240" width="84" height="44" rx="22" fill="url(#violet)"/>
    <path d="M364 262h40" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M348 282l-34 44" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" opacity=".5"/>
  </g>

  <path d="M348 164C394 162 398 162 408 164" fill="none" stroke="#14B8A6" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  <path d="M348 338C376 356 388 368 404 382" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round" opacity=".42"/>
</svg>
